[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scibench"
version = "0.1.0"
description = "A small pack of scientific-computing coding benchmarks (numerical linear algebra, constrained optimisation, power iteration) with reference solutions, tolerances, edge cases, and automated verifiers for evaluating model-generated numerical code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishabh Jha" }]
keywords = ["benchmark", "numerical-methods", "evaluation", "scientific-computing"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
